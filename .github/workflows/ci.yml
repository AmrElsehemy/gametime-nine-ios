name: Nine iOS CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: macos-latest
    env:
      GAMETIMEKIT_READ_TOKEN: ${{ secrets.GAMETIMEKIT_READ_TOKEN }}
    steps:
      - name: Checkout Nine
        uses: actions/checkout@v4
        with:
          path: gametime-nine-ios

      - name: Checkout real GameTimeKit when cross-repo token is configured
        if: ${{ env.GAMETIMEKIT_READ_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: AmrElsehemy/gametime-ios
          token: ${{ env.GAMETIMEKIT_READ_TOKEN }}
          path: gametime-ios

      - name: Create CI GameTimeKit contract stub when token is unavailable
        if: ${{ env.GAMETIMEKIT_READ_TOKEN == '' }}
        shell: bash
        run: |
          mkdir -p gametime-ios/Sources/GameTimeCore gametime-ios/Sources/GameTimeExperience
          cat > gametime-ios/Package.swift <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(
              name: "GameTimeKitCIStub",
              platforms: [.iOS(.v17)],
              products: [
                  .library(name: "GameTimeCore", targets: ["GameTimeCore"]),
                  .library(name: "GameTimeExperience", targets: ["GameTimeExperience"])
              ],
              targets: [
                  .target(name: "GameTimeCore"),
                  .target(name: "GameTimeExperience", dependencies: ["GameTimeCore"])
              ]
          )
          EOF
          cat > gametime-ios/Sources/GameTimeCore/GameTimeCore.swift <<'EOF'
          public enum GameTimeKit {
              public static let version = "ci-contract-stub"
          }
          EOF
          cat > gametime-ios/Sources/GameTimeExperience/GameTimeExperience.swift <<'EOF'
          import GameTimeCore
          public enum GameTimeExperienceContractStub {}
          EOF

      - name: Explain dependency mode
        run: |
          if [ -d gametime-ios/.git ]; then
            echo "Using real private GameTimeKit checkout."
          else
            echo "Using compile-contract stub because GAMETIMEKIT_READ_TOKEN is not configured."
            echo "GameTimeKit itself is validated independently in AmrElsehemy/gametime-ios CI."
          fi

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; ids=[d["udid"] for devices in data.values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; print(ids[0] if ids else "")')
          test -n "$DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test Nine
        working-directory: gametime-nine-ios
        run: |
          xcodebuild \
            -project Nine.xcodeproj \
            -scheme Nine \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            test
