name: Nine iOS CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout Nine
        uses: actions/checkout@v4
        with:
          path: gametime-nine-ios

      - name: Checkout GameTimeKit
        uses: actions/checkout@v4
        with:
          repository: AmrElsehemy/gametime-ios
          token: ${{ secrets.GITHUB_TOKEN }}
          path: gametime-ios

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; ids=[d["udid"] for devices in data.values() for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]; print(ids[0] if ids else "")')
          test -n "$DEVICE_ID"
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test Nine
        working-directory: gametime-nine-ios
        run: |
          xcodebuild \
            -project Nine.xcodeproj \
            -scheme Nine \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO \
            test
