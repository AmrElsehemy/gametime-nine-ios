name: Bootstrap Nine Content Factory

on:
  push:
    branches: [feat/content-factory-7]
    paths:
      - Tools/level_factory.py
      - .github/workflows/bootstrap-content-factory.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/content-factory-7
          fetch-depth: 0

      - name: Generate deterministic production pack
        run: python3 Tools/level_factory.py --write Nine/Resources/NineLevels-v1.json

      - name: Update catalog-count assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NineTests/NineLevelPipelineTests.swift')
          text = path.read_text()
          text = text.replace('func bundledDay3CatalogIsValidUniqueAndDeterministic()', 'func bundledV1CatalogIsValidUniqueAndDeterministic()')
          text = text.replace('#expect(pack.levels.count == 20)', '#expect(pack.levels.count == 100)')
          text = text.replace('#expect(!NineContentGate.testFlight.isSatisfied(by: pack.levels.count))', '#expect(NineContentGate.testFlight.isSatisfied(by: pack.levels.count))\n    #expect(NineContentGate.submission.isSatisfied(by: pack.levels.count))\n    #expect(NineContentGate.v1Target.isSatisfied(by: pack.levels.count))')
          path.write_text(text)
          PY

      - name: Commit generated pack
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Content pack already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Nine/Resources/NineLevels-v1.json NineTests/NineLevelPipelineTests.swift
          git commit -m 'Generate solver-verified 100-level v1 pack'
          git push origin HEAD:feat/content-factory-7
