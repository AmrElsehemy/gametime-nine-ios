name: Install Tactile Theme

on:
  push:
    branches: [feat/capture-assets-18]
    paths:
      - Tools/install_tactile_theme.py
      - .github/workflows/install-tactile-theme.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/capture-assets-18
          fetch-depth: 0
      - name: Apply production theme
        run: python3 Tools/install_tactile_theme.py
      - name: Remove one-time installer
        run: rm -f Tools/install_tactile_theme.py .github/workflows/install-tactile-theme.yml
      - name: Commit themed production UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply approved Tactile Territories production theme'
          git push origin HEAD:feat/capture-assets-18
