name: Bootstrap Commerce Finish

on:
  push:
    branches: [feat/commerce-14]
    paths:
      - .github/workflows/bootstrap-commerce-finish.yml
      - Tools/finish_commerce.py

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/commerce-14
          fetch-depth: 0
      - name: Sync current master
        run: |
          git fetch origin master
          git merge -X theirs --no-edit origin/master
      - name: Wire rewarded hint flow
        run: python3 Tools/finish_commerce.py
      - name: Use real GameTimeKit CI workflow
        run: git checkout origin/master -- .github/workflows/ci.yml
      - name: Remove bootstrap helpers
        run: rm -f Tools/finish_commerce.py .github/workflows/bootstrap-commerce-finish.yml
      - name: Commit completed commerce flow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish optional rewarded hint flow'
          git push origin HEAD:feat/commerce-14
