name: Level pack
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the level pack matches the factory output
        run: python Tools/level_factory.py --check ExactlyOne/Resources/ExactlyOneLevels-v1.json
